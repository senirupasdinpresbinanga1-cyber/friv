<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fire & Water - Main Game</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background: #0a0a12; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; background: #161625; padding: 6px 12px; height: 36px; color: #fff; font-size: 13px; border-bottom: 1px solid #333; flex-shrink: 0; }
        .header-nav a { color: #4da6ff; text-decoration: none; font-weight: bold; }
        
        #game-wrapper { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #12121c; overflow: hidden; }
        canvas { background: #181824; display: block; box-shadow: 0 0 15px rgba(0,0,0,0.9); }

        /* Panel Kontrol di Bawah Layar - Kiri (Api) & Kanan (Air) */
        .controls-bottom {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 10;
        }
        .pad-group {
            pointer-events: auto;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .btn-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ctrl-btn {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .ctrl-btn.active, .ctrl-btn:active {
            transform: scale(0.92);
        }
        /* Warna Tombol */
        .fire-ctrl .ctrl-btn { background: rgba(231, 76, 60, 0.6); border-color: #ff6b6b; }
        .fire-ctrl .ctrl-btn.active { background: rgba(231, 76, 60, 0.9); }
        
        .water-ctrl .ctrl-btn { background: rgba(52, 152, 219, 0.6); border-color: #74b9ff; }
        .water-ctrl .ctrl-btn.active { background: rgba(52, 152, 219, 0.9); }

        .tag-player { font-size: 11px; font-weight: bold; color: #fff; text-shadow: 0 0 3px #000; text-align: center; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="header-nav">
        <div>
            <a href="index.html">◄ Menu Utama</a> | 
            <span id="level-display" style="color:#f39c12; font-weight:bold;">LEVEL 1</span>
        </div>
        <div>
            <span style="color:#ff6b6b; margin-right:15px;">P1 (Api): Kiri Bawah</span>
            <span style="color:#74b9ff;">P2 (Air): Kanan Bawah</span>
        </div>
    </div>

    <div id="game-wrapper">
        <canvas id="canvas" width="800" height="420"></canvas>
        
        <!-- Tombol Kontrol di Bawah Layar -->
        <div class="controls-bottom">
            <!-- Kontrol Kiri: Pemain 1 (Api) -->
            <div class="pad-group fire-ctrl">
                <div>
                    <div class="ctrl-btn" id="f-left">◀</div>
                    <div class="tag-player">KIRI</div>
                </div>
                <div>
                    <div class="ctrl-btn" id="f-right">▶</div>
                    <div class="tag-player">KANAN</div>
                </div>
                <div>
                    <div class="ctrl-btn" id="f-up">▲</div>
                    <div class="tag-player">JUMP</div>
                </div>
            </div>

            <!-- Kontrol Kanan: Pemain 2 (Air) -->
            <div class="pad-group water-ctrl">
                <div>
                    <div class="ctrl-btn" id="w-up">▲</div>
                    <div class="tag-player">JUMP</div>
                </div>
                <div>
                    <div class="ctrl-btn" id="w-left">◀</div>
                    <div class="tag-player">KIRI</div>
                </div>
                <div>
                    <div class="ctrl-btn" id="w-right">▶</div>
                    <div class="tag-player">KANAN</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = 800, H = 420;

        const urlParams = new URLSearchParams(window.location.search);
        let currentLevel = parseInt(urlParams.get('level')) || 1;
        document.getElementById('level-display').innerText = `LEVEL ${currentLevel}`;

        // Sistem Input Multi-Touch & Keyboard
        const keys = { 'ArrowLeft': false, 'ArrowRight': false, 'ArrowUp': false, 'KeyA': false, 'KeyD': false, 'KeyW': false };

        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        // Pengaturan Multi-Touch agar jari tidak bentrok
        function setupTouchButton(elemId, keyCode) {
            const el = document.getElementById(elemId);
            let activeTouchId = null;

            el.addEventListener('touchstart', e => {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    if (activeTouchId === null) {
                        activeTouchId = touch.identifier;
                        keys[keyCode] = true;
                        el.classList.add('active');
                    }
                }
            }, {passive: false});

            const releaseTouch = e => {
                e.preventDefault();
                for (let touch of e.changedTouches) {
                    if (touch.identifier === activeTouchId) {
                        activeTouchId = null;
                        keys[keyCode] = false;
                        el.classList.remove('active');
                    }
                }
            };

            el.addEventListener('touchend', releaseTouch, {passive: false});
            el.addEventListener('touchcancel', releaseTouch, {passive: false});
            el.addEventListener('mousedown', () => { keys[keyCode] = true; el.classList.add('active'); });
            el.addEventListener('mouseup', () => { keys[keyCode] = false; el.classList.remove('active'); });
            el.addEventListener('mouseleave', () => { keys[keyCode] = false; el.classList.remove('active'); });
        }

        setupTouchButton('f-left', 'ArrowLeft');
        setupTouchButton('f-right', 'ArrowRight');
        setupTouchButton('f-up', 'ArrowUp');
        setupTouchButton('w-left', 'KeyA');
        setupTouchButton('w-right', 'KeyD');
        setupTouchButton('w-up', 'KeyW');

        // Generator 10 Level dengan Tembok Bingkai Penuh & Rintangan Lengkap
        function generateLevels() {
            let levels = [];
            for(let i = 1; i <= 10; i++) {
                // Bingkai luar (tembok full tidak bisa ditembus)
                let platforms = [
                    {x: 0, y: 0, w: 800, h: 20},   // Atas
                    {x: 0, y: 400, w: 800, h: 20},  // Bawah
                    {x: 0, y: 0, w: 20, h: 420},    // Kiri
                    {x: 780, y: 0, w: 20, h: 420},  // Kanan
                    // Platform internal & sekat tembok labirin
                    {x: 20, y: 310, w: 280, h: 20},
                    {x: 380, y: 310, w: 400, h: 20},
                    {x: 150, y: 210, w: 500, h: 20},
                    {x: 250, y: 110, w: 300, h: 20},
                    // Sekat vertikal tambahan agar tidak curang
                    {x: 350, y: 210, w: 20, h: 100},
                    {x: 550, y: 110, w: 20, h: 100}
                ];

                let hazards = [
                    {x: 100, y: 385, w: 80, h: 15, type: i % 2 === 0 ? 'lava' : 'water'},
                    {x: 600, y: 385, w: 80, h: 15, type: 'slime'},
                    {x: 300, y: 195, w: 50, h: 15, type: i % 3 === 0 ? 'water' : 'lava'}
                ];

                let buttons = [
                    {x: 50, y: 302, w: 35, h: 8, pressed: false, targetDoor: 0}
                ];

                let doors = [
                    {x: 700, y: 210, w: 15, h: 100, openY: 120, currentY: 210}
                ];

                let box = {x: 200, y: 270, w: 30, h: 30, vx: 0, vy: 0};

                let doorsFinish = {
                    fire: {x: 660, y: 50, w: 35, h: 60},
                    water: {x: 720, y: 50, w: 35, h: 60}
                };

                levels.push({ platforms, hazards, buttons, doors, box, doorsFinish });
            }
            return levels;
        }

        const levelMaps = generateLevels();
        let map, fire, water;

        function loadLevel(lvlIdx) {
            map = JSON.parse(JSON.stringify(levelMaps[lvlIdx - 1]));
            fire = {x: 40, y: 350, w: 26, h: 36, vx: 0, vy: 0, grounded: false, dead: false};
            water = {x: 80, y: 350, w: 26, h: 36, vx: 0, vy: 0, grounded: false, dead: false};
        }

        loadLevel(currentLevel);

        // Web Audio Sintetis Suara
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // Fisika & Collision Sumbu Terpisah (Anti Tembus Tembok)
        function moveAndCollide(entity, plats) {
            // Sumbu X
            entity.x += entity.vx;
            plats.forEach(plat => {
                if(entity.x < plat.x + plat.w && entity.x + entity.w > plat.x && entity.y < plat.y + plat.h && entity.y + entity.h > plat.y) {
                    if(entity.vx > 0) entity.x = plat.x - entity.w;
                    else if(entity.vx < 0) entity.x = plat.x + plat.w;
                }
            });

            // Sumbu Y
            entity.grounded = false;
            entity.y += entity.vy;
            plats.forEach(plat => {
                if(entity.x < plat.x + plat.w && entity.x + entity.w > plat.x && entity.y < plat.y + plat.h && entity.y + entity.h > plat.y) {
                    if(entity.vy > 0) { // Jatuh ke bawah
                        entity.y = plat.y - entity.h;
                        entity.vy = 0;
                        entity.grounded = true;
                    } else if(entity.vy < 0) { // Bentur kepala di atas
                        entity.y = plat.y + plat.h;
                        entity.vy = 0;
                    }
                }
            });
        }

        function update() {
            if(fire.dead || water.dead) return;

            // Kontrol Fire (Panah)
            if(keys['ArrowLeft']) fire.vx = -3.2;
            else if(keys['ArrowRight']) fire.vx = 3.2;
            else fire.vx *= 0.7;

            if(keys['ArrowUp'] && fire.grounded) {
                fire.vy = -9.2; fire.grounded = false; playSound(420, 'square', 0.1);
            }

            // Kontrol Water (A, D, W)
            if(keys['KeyA']) water.vx = -3.2;
            else if(keys['KeyD']) water.vx = 3.2;
            else water.vx *= 0.7;

            if(keys['KeyW'] && water.grounded) {
                water.vy = -9.2; water.grounded = false; playSound(520, 'triangle', 0.1);
            }

            // Gravitasi
            fire.vy += 0.42; water.vy += 0.42;

            // Kumpulan platform + pintu geser yang tertutup sebagai tembok solid
            let activePlatforms = [...map.platforms];
            map.doors.forEach(d => {
                activePlatforms.push({x: d.x, y: d.currentY, w: d.w, h: d.h});
            });

            moveAndCollide(fire, activePlatforms);
            moveAndCollide(water, activePlatforms);

            // Kotak Dorong Co-Op
            let box = map.box;
            box.vy += 0.42;
            box.y += box.vy;
            map.platforms.forEach(plat => {
                if(box.x < plat.x + plat.w && box.x + box.w > plat.x && box.y < plat.y + plat.h && box.y + box.h > plat.y) {
                    if(box.vy > 0) { box.y = plat.y - box.h; box.vy = 0; }
                }
            });

            let firePush = (fire.x + fire.w > box.x && fire.x < box.x + box.w && Math.abs(fire.y - box.y) < 25);
            let waterPush = (water.x + water.w > box.x && water.x < box.x + box.w && Math.abs(water.y - box.y) < 25);

            if(firePush && waterPush) {
                box.vx = (fire.vx + water.vx) * 0.85; // Cepat jika didorong berdua
            } else if(firePush) {
                box.vx = fire.vx * 0.3; // Berat jika sendirian
            } else if(waterPush) {
                box.vx = water.vx * 0.3;
            } else {
                box.vx *= 0.6;
            }
            box.x += box.vx;

            // Tombol Injak & Pintu
            map.buttons.forEach(btn => {
                let pressed = [fire, water, box].some(o => o.x < btn.x + btn.w && o.x + o.w > btn.x && o.y + o.h >= btn.y - 2 && o.y < btn.y + btn.h);
                btn.pressed = pressed;
                let door = map.doors[btn.targetDoor];
                if(door) {
                    let targetY = pressed ? door.openY : door.y;
                    door.currentY += (targetY - door.currentY) * 0.15;
                }
            });

            // Cek Rintangan (Lava / Air / Slime)
            map.hazards.forEach(h => {
                [fire, water].forEach(p => {
                    if(p.x < h.x + h.w && p.x + p.w > h.x && p.y + p.h > h.y + 6 && p.y < h.y + h.h) {
                        if(h.type === 'slime') p.dead = true;
                        if(h.type === 'water' && p === fire) p.dead = true;
                        if(h.type === 'lava' && p === water) p.dead = true;
                        if(p.dead) {
                            playSound(130, 'sawtooth', 0.4);
                            setTimeout(() => loadLevel(currentLevel), 700);
                        }
                    }
                });
            });

            // Cek Kemenangan Level
            let dF = map.doorsFinish.fire, dW = map.doorsFinish.water;
            let fireWin = fire.x > dF.x && fire.x + fire.w < dF.x + dF.w && fire.y > dF.y;
            let waterWin = water.x > dW.x && water.x + water.w < dW.x + dW.w && water.y > dW.y;
            if(fireWin && waterWin) {
                playSound(800, 'sine', 0.3);
                alert(`SELAMAT! LEVEL ${currentLevel} SELESAI!`);
                if(currentLevel < 10) {
                    currentLevel++;
                    loadLevel(currentLevel);
                    document.getElementById('level-display').innerText = `LEVEL ${currentLevel}`;
                } else {
                    alert(" LUAR BIASA! ANDA TELAH MENYELESAIKAN SEMUA 10 LEVEL!");
                    currentLevel = 1;
                    loadLevel(1);
                    document.getElementById('level-display').innerText = `LEVEL 1`;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Dinding & Platform
            ctx.fillStyle = '#222831';
            map.platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

            // Rintangan (Lava, Air, Slime)
            let time = Date.now() * 0.005;
            map.hazards.forEach(h => {
                ctx.fillStyle = h.type === 'lava' ? '#e74c3c' : (h.type === 'water' ? '#3498db' : '#2ecc71');
                ctx.fillRect(h.x, h.y, h.w, h.h);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                for(let x = h.x; x < h.x + h.w; x += 10) {
                    ctx.fillRect(x, h.y + Math.sin(time + x) * 2, 5, 3);
                }
            });

            // Tombol Injak
            map.buttons.forEach(b => {
                ctx.fillStyle = b.pressed ? '#f1c40f' : '#e67e22';
                ctx.fillRect(b.x, b.y + (b.pressed ? 4 : 0), b.w, b.h - (b.pressed ? 4 : 0));
            });

            // Pintu Geser
            ctx.fillStyle = '#9b59b6';
            map.doors.forEach(d => ctx.fillRect(d.x, d.currentY, d.w, d.h));

            // Batu Dorong
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(map.box.x, map.box.y, map.box.w, map.box.h);
            ctx.strokeStyle = '#bdc3c7'; ctx.strokeRect(map.box.x, map.box.y, map.box.w, map.box.h);

            // Pintu Keluar Finish
            ctx.fillStyle = '#c0392b'; ctx.fillRect(map.doorsFinish.fire.x, map.doorsFinish.fire.y, map.doorsFinish.fire.w, map.doorsFinish.fire.h);
            ctx.fillStyle = '#2980b9'; ctx.fillRect(map.doorsFinish.water.x, map.doorsFinish.water.y, map.doorsFinish.water.w, map.doorsFinish.water.h);

            // Karakter Api (Pemain 1)
            if(!fire.dead) {
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(fire.x, fire.y, fire.w, fire.h);
                ctx.fillStyle = '#f1c40f'; // Efek kepala api
                ctx.fillRect(fire.x + 4, fire.y - 6 + Math.sin(time*4)*3, 18, 8);
            }

            // Karakter Air (Pemain 2)
            if(!water.dead) {
                ctx.fillStyle = '#3498db';
                ctx.fillRect(water.x, water.y, water.w, water.h);
                ctx.fillStyle = '#74b9ff'; // Efek kepala air
                ctx.fillRect(water.x + 6, water.y - 4 + Math.cos(time*4)*2, 14, 6);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
