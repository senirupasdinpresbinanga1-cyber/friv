<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fire & Water 3D - Gameplay</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background: #0a0a10; font-family: Arial, sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; background: #151520; padding: 6px 16px; height: 38px; color: #fff; font-size: 13px; border-bottom: 2px solid #2c3e50; flex-shrink: 0; }
        .header-nav a { color: #00cec9; text-decoration: none; font-weight: bold; }
        
        #game-wrapper { position: relative; flex: 1; display: flex; justify-content: center; align-items: center; background: #0f0f15; overflow: hidden; }
        canvas { background: #181824; display: block; box-shadow: 0 0 25px rgba(0,0,0,0.9); border-radius: 4px; }

        .controls-bottom { position: absolute; bottom: 8px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: none; z-index: 10; }
        .pad-group { pointer-events: auto; display: flex; gap: 10px; align-items: center; }
        .ctrl-btn { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: white; box-shadow: 0 6px 12px rgba(0,0,0,0.6); }
        
        .fire-ctrl .ctrl-btn { background: rgba(235, 77, 75, 0.65); border-color: #ff7979; }
        .fire-ctrl .ctrl-btn.active { background: rgba(235, 77, 75, 0.95); transform: scale(0.92); }
        
        .water-ctrl .ctrl-btn { background: rgba(9, 132, 227, 0.65); border-color: #74b9ff; }
        .water-ctrl .ctrl-btn.active { background: rgba(9, 132, 227, 0.95); transform: scale(0.92); }

        .tag-player { font-size: 10px; font-weight: bold; color: #dfe6e9; text-shadow: 0 0 4px #000; text-align: center; margin-top: 3px; }
    </style>
</head>
<body>
    <div class="header-nav">
        <div>
            <a href="index.html">◄ Menu Utama</a> | 
            <span id="level-display" style="color:#fdcb6e; font-weight:bold; margin-left:8px;">LEVEL 1</span>
        </div>
        <div>
            <span style="color:#ff7979; font-weight:bold; margin-right:15px;">P1 (API): Kiri Bawah</span>
            <span style="color:#74b9ff; font-weight:bold;">P2 (AIR): Kanan Bawah</span>
        </div>
    </div>

    <div id="game-wrapper">
        <canvas id="canvas" width="800" height="440"></canvas>
        
        <div class="controls-bottom">
            <div class="pad-group fire-ctrl">
                <div><div class="ctrl-btn" id="f-left">◀</div><div class="tag-player">KIRI</div></div>
                <div><div class="ctrl-btn" id="f-right">▶</div><div class="tag-player">KANAN</div></div>
                <div><div class="ctrl-btn" id="f-up">▲</div><div class="tag-player">JUMP</div></div>
            </div>
            <div class="pad-group water-ctrl">
                <div><div class="ctrl-btn" id="w-up">▲</div><div class="tag-player">JUMP</div></div>
                <div><div class="ctrl-btn" id="w-left">◀</div><div class="tag-player">KIRI</div></div>
                <div><div class="ctrl-btn" id="w-right">▶</div><div class="tag-player">KANAN</div></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = 800, H = 440;

        const urlParams = new URLSearchParams(window.location.search);
        let currentLevel = parseInt(urlParams.get('level')) || 1;
        document.getElementById('level-display').innerText = `LEVEL ${currentLevel}`;

        const keys = { 'ArrowLeft': false, 'ArrowRight': false, 'ArrowUp': false, 'KeyA': false, 'KeyD': false, 'KeyW': false };

        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.code)) keys[e.code] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.code)) keys[e.code] = false; });

        function setupTouch(id, code) {
            const el = document.getElementById(id);
            let touchId = null;

            el.addEventListener('touchstart', e => {
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (touchId === null) {
                        touchId = t.identifier;
                        keys[code] = true;
                        el.classList.add('active');
                    }
                }
            }, {passive: false});

            const end = e => {
                e.preventDefault();
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        touchId = null;
                        keys[code] = false;
                        el.classList.remove('active');
                    }
                }
            };

            el.addEventListener('touchend', end, {passive: false});
            el.addEventListener('touchcancel', end, {passive: false});
            el.addEventListener('mousedown', () => { keys[code] = true; el.classList.add('active'); });
            el.addEventListener('mouseup', () => { keys[code] = false; el.classList.remove('active'); });
            el.addEventListener('mouseleave', () => { keys[code] = false; el.classList.remove('active'); });
        }

        setupTouch('f-left', 'ArrowLeft'); setupTouch('f-right', 'ArrowRight'); setupTouch('f-up', 'ArrowUp');
        setupTouch('w-left', 'KeyA'); setupTouch('w-right', 'KeyD'); setupTouch('w-up', 'KeyW');

        // Generator 10 Level Unik dengan Variasi Cairan (Lava, Air, Slime)
        function getLevelData(lvl) {
            let platforms = [
                {x: 0, y: 0, w: 800, h: 22},    // Atas
                {x: 0, y: 418, w: 800, h: 22},   // Bawah
                {x: 0, y: 0, w: 22, h: 440},     // Kiri
                {x: 778, y: 0, w: 22, h: 440}    // Kanan
            ];
            let hazards = [];
            let buttons = [];
            let doors = [];
            let box = {x: 200, y: 200, w: 32, h: 32, vx: 0, vy: 0};
            let doorsFinish = { fire: {x: 700, y: 30, w: 38, h: 55}, water: {x: 742, y: 30, w: 38, h: 55} };
            let spawn = { fire: {x: 45, y: 370}, water: {x: 85, y: 370} };

            if (lvl === 1) {
                platforms.push({x: 22, y: 340, w: 756, h: 20});
                platforms.push({x: 350, y: 354, w: 80, h: 6});
                hazards.push({x: 350, y: 340, w: 80, h: 14, type: 'lava'});
                buttons.push({x: 200, y: 332, w: 34, h: 8, pressed: false, targetDoor: 0});
                buttons.push({x: 600, y: 332, w: 34, h: 8, pressed: false, targetDoor: 0});
                doors.push({x: 500, y: 240, w: 18, h: 100, openY: 150, currentY: 240});
                platforms.push({x: 22, y: 240, w: 756, h: 20});
                box = {x: 250, y: 300, w: 32, h: 32, vx: 0, vy: 0};
            } else if (lvl === 2) {
                platforms.push({x: 22, y: 340, w: 400, h: 20}, {x: 480, y: 340, w: 298, h: 20});
                platforms.push({x: 400, y: 354, w: 80, h: 6});
                hazards.push({x: 400, y: 340, w: 80, h: 14, type: 'water'});
                platforms.push({x: 100, y: 230, w: 678, h: 20});
                platforms.push({x: 250, y: 244, w: 70, h: 6});
                hazards.push({x: 250, y: 230, w: 70, h: 14, type: 'slime'});
                buttons.push({x: 120, y: 332, w: 34, h: 8, pressed: false, targetDoor: 0});
                buttons.push({x: 650, y: 222, w: 34, h: 8, pressed: false, targetDoor: 0});
                doors.push({x: 580, y: 140, w: 18, h: 90, openY: 50, currentY: 140});
                platforms.push({x: 22, y: 140, w: 756, h: 20});
                box = {x: 200, y: 290, w: 32, h: 32, vx: 0, vy: 0};
            } else {
                // Level 3 s.d 10: Kompleksitas bertambah
                let floors = 4;
                let stepY = 380 / floors;
                for(let f = 1; f < floors; f++) {
                    let yPos = f * stepY;
                    let gapX = (f * 130) % 500;
                    platforms.push({x: 22, y: yPos, w: gapX, h: 20});
                    platforms.push({x: gapX + 80, y: yPos, w: 756 - (gapX + 80), h: 20});
                    platforms.push({x: gapX, y: yPos + 14, w: 80, h: 6});
                    let typeH = (f % 3 === 0) ? 'slime' : (f % 2 === 0 ? 'water' : 'lava');
                    hazards.push({x: gapX, y: yPos, w: 80, h: 14, type: typeH});
                }
                buttons.push({x: 50, y: 332, w: 34, h: 8, pressed: false, targetDoor: 0});
                buttons.push({x: 700, y: 100, w: 34, h: 8, pressed: false, targetDoor: 0});
                doors.push({x: 600, y: 200, w: 18, h: 100, openY: 100, currentY: 200});
                box = {x: 200, y: 150, w: 32, h: 32, vx: 0, vy: 0};
            }

            return { platforms, hazards, buttons, doors, box, doorsFinish, spawn };
        }

        let map, fire, water;

        function loadLevel(lvlIdx) {
            map = getLevelData(lvlIdx);
            fire = {x: map.spawn.fire.x, y: map.spawn.fire.y, w: 24, h: 36, vx: 0, vy: 0, grounded: false, dead: false};
            water = {x: map.spawn.water.x, y: map.spawn.water.y, w: 24, h: 36, vx: 0, vy: 0, grounded: false, dead: false};
        }

        loadLevel(currentLevel);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type; osc.frequency.value = freq;
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function moveEntity(ent, plats) {
            ent.x += ent.vx;
            plats.forEach(p => {
                if(ent.x < p.x + p.w && ent.x + ent.w > p.x && ent.y < p.y + p.h && ent.y + ent.h > p.y) {
                    if(ent.vx > 0) ent.x = p.x - ent.w;
                    else if(ent.vx < 0) ent.x = p.x + p.w;
                }
            });

            ent.grounded = false;
            ent.y += ent.vy;
            plats.forEach(p => {
                if(ent.x < p.x + p.w && ent.x + ent.w > p.x && ent.y < p.y + p.h && ent.y + ent.h > p.y) {
                    if(ent.vy > 0) {
                        ent.y = p.y - ent.h;
                        ent.vy = 0;
                        ent.grounded = true;
                    } else if(ent.vy < 0) {
                        ent.y = p.y + p.h;
                        ent.vy = 0;
                    }
                }
            });
        }

        function update() {
            if(fire.dead || water.dead) return;

            if(keys['ArrowLeft']) fire.vx = -3.4;
            else if(keys['ArrowRight']) fire.vx = 3.4;
            else fire.vx *= 0.7;

            if(keys['ArrowUp'] && fire.grounded) {
                fire.vy = -9.4; fire.grounded = false; playSound(440, 'square', 0.1);
            }

            if(keys['KeyA']) water.vx = -3.4;
            else if(keys['KeyD']) water.vx = 3.4;
            else water.vx *= 0.7;

            if(keys['KeyW'] && water.grounded) {
                water.vy = -9.4; water.grounded = false; playSound(540, 'triangle', 0.1);
            }

            fire.vy += 0.44; water.vy += 0.44;

            // HANYA masukkan pintu ke dalam rintangan solid JIKA pintu tertutup (currentY jauh dari openY)
            let solidObstacles = [...map.platforms];
            map.doors.forEach(d => {
                if (Math.abs(d.currentY - d.openY) > 5) {
                    solidObstacles.push({x: d.x, y: d.currentY, w: d.w, h: d.h});
                }
            });

            moveEntity(fire, solidObstacles);
            moveEntity(water, solidObstacles);

            let box = map.box;
            box.vy += 0.44; box.y += box.vy;
            map.platforms.forEach(p => {
                if(box.x < p.x + p.w && box.x + box.w > p.x && box.y < p.y + p.h && box.y + box.h > p.y) {
                    if(box.vy > 0) { box.y = p.y - box.h; box.vy = 0; }
                }
            });

            let firePush = (fire.x + fire.w > box.x && fire.x < box.x + box.w && Math.abs(fire.y - box.y) < 28);
            let waterPush = (water.x + water.w > box.x && water.x < box.x + box.w && Math.abs(water.y - box.y) < 28);

            if(firePush && waterPush) box.vx = (fire.vx + water.vx) * 0.8;
            else if(firePush) box.vx = fire.vx * 0.35;
            else if(waterPush) box.vx = water.vx * 0.35;
            else box.vx *= 0.6;

            box.x += box.vx;
            map.platforms.forEach(p => {
                if(box.x < p.x + p.w && box.x + box.w > p.x && box.y < p.y + p.h && box.y + box.h > p.y) {
                    if(box.vx > 0) box.x = p.x - box.w;
                    else if(box.vx < 0) box.x = p.x + p.w;
                }
            });

            // Logika Dual Tombol Per Pintu
            map.doors.forEach((door, doorIndex) => {
                let isAnyButtonPressed = map.buttons.some(btn => {
                    if(btn.targetDoor !== doorIndex) return false;
                    let pressed = [fire, water, box].some(o => o.x < btn.x + btn.w && o.x + o.w > btn.x && o.y + o.h >= btn.y - 2 && o.y < btn.y + btn.h);
                    btn.pressed = pressed;
                    return pressed;
                });

                let targetY = isAnyButtonPressed ? door.openY : door.y;
                door.currentY += (targetY - door.currentY) * 0.08;
            });

            // Aturan Kematian Sesuai Elemen:
            // - Api menyentuh Lava (Aman), Api menyentuh Air/Slime (Mati)
            // - Air menyentuh Air (Aman), Air menyentuh Lava/Slime (Mati)
            map.hazards.forEach(h => {
                [fire, water].forEach(p => {
                    if(p.x < h.x + h.w && p.x + p.w > h.x && p.y + p.h > h.y + 4 && p.y < h.y + h.h) {
                        let isDead = false;
                        if(h.type === 'slime') isDead = true;
                        if(h.type === 'water' && p === fire) isDead = true;
                        if(h.type === 'lava' && p === water) isDead = true;

                        if(isDead) {
                            p.dead = true;
                            playSound(120, 'sawtooth', 0.4);
                            setTimeout(() => loadLevel(currentLevel), 600);
                        }
                    }
                });
            });

            // Menang Level
            let dF = map.doorsFinish.fire, dW = map.doorsFinish.water;
            let fireWin = fire.x > dF.x && fire.x + fire.w < dF.x + dF.w && fire.y > dF.y;
            let waterWin = water.x > dW.x && water.x + water.w < dW.x + dW.w && water.y > dW.y;
            if(fireWin && waterWin) {
                playSound(880, 'sine', 0.4);
                alert(`LEVEL ${currentLevel} SELESAI!`);
                if(currentLevel < 10) {
                    currentLevel++;
                    loadLevel(currentLevel);
                    document.getElementById('level-display').innerText = `LEVEL ${currentLevel}`;
                } else {
                    alert("LUAR BIASA! ANDA MENYELESAIKAN SEMUA 10 LEVEL!");
                    currentLevel = 1;
                    loadLevel(1);
                    document.getElementById('level-display').innerText = `LEVEL 1`;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            map.platforms.forEach(p => {
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#34495e'; ctx.fillRect(p.x, p.y, p.w, 3);
                ctx.fillStyle = '#1a252f'; ctx.fillRect(p.x + p.w - 3, p.y, 3, p.h);
            });

            let time = Date.now() * 0.006;
            map.hazards.forEach(h => {
                let colorBase = h.type === 'lava' ? '#e74c3c' : (h.type === 'water' ? '#0984e3' : '#2ecc71');
                let colorSurface = h.type === 'lava' ? '#ff7675' : (h.type === 'water' ? '#74b9ff' : '#55efc4');

                ctx.fillStyle = colorBase;
                ctx.fillRect(h.x, h.y + 3, h.w, h.h - 3);

                ctx.fillStyle = colorSurface;
                ctx.beginPath();
                ctx.moveTo(h.x, h.y + 3);
                for (let x = 0; x <= h.w; x += 5) {
                    let waveY = Math.sin(time*2 + (h.x + x)*0.1) * 2.5;
                    ctx.lineTo(h.x + x, h.y + 2 + waveY);
                }
                ctx.lineTo(h.x + h.w, h.y + h.h);
                ctx.lineTo(h.x, h.y + h.h);
                ctx.closePath();
                ctx.fill();
            });

            map.buttons.forEach(b => {
                ctx.fillStyle = b.pressed ? '#f1c40f' : '#e67e22';
                let offset = b.pressed ? 4 : 0;
                ctx.fillRect(b.x, b.y + offset, b.w, b.h - offset);
            });

            // Render Pintu (hanya digambar jika belum terbuka penuh)
            map.doors.forEach(d => {
                if (Math.abs(d.currentY - d.openY) > 2) {
                    ctx.fillStyle = '#8e44ad'; ctx.fillRect(d.x, d.currentY, d.w, d.h);
                    ctx.fillStyle = '#9b59b6'; ctx.fillRect(d.x + 2, d.currentY + 2, d.w - 4, d.h - 4);
                }
            });

            let b = map.box;
            ctx.fillStyle = '#7f8c8d'; ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = '#95a5a6'; ctx.fillRect(b.x, b.y, b.w - 4, 4);
            ctx.fillStyle = '#34495e'; ctx.fillRect(b.x + b.w - 4, b.y, 4, b.h);

            ctx.fillStyle = '#d63031'; ctx.fillRect(map.doorsFinish.fire.x, map.doorsFinish.fire.y, map.doorsFinish.fire.w, map.doorsFinish.fire.h);
            ctx.fillStyle = '#0984e3'; ctx.fillRect(map.doorsFinish.water.x, map.doorsFinish.water.y, map.doorsFinish.water.w, map.doorsFinish.water.h);

            if(!fire.dead) {
                ctx.fillStyle = '#ff7675'; ctx.fillRect(fire.x, fire.y + 10, fire.w, fire.h - 10);
                ctx.fillStyle = '#d63031';
                ctx.beginPath(); ctx.arc(fire.x + fire.w/2, fire.y + 10, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fdcb6e';
                let flameH = 8 + Math.sin(time*5) * 4;
                ctx.fillRect(fire.x + 6, fire.y - flameH, 12, flameH);
            }

            if(!water.dead) {
                ctx.fillStyle = '#74b9ff'; ctx.fillRect(water.x, water.y + 10, water.w, water.h - 10);
                ctx.fillStyle = '#0984e3';
                ctx.beginPath(); ctx.arc(water.x + water.w/2, water.y + 10, 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#81ecec';
                let dropH = 6 + Math.cos(time*5) * 3;
                ctx.fillRect(water.x + 7, water.y - dropH, 10, dropH);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
