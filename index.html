<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fire & Water - Co-Op Dual Button</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; background: #0b0c10; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; overflow: hidden; }
        .nav-bar { display: flex; justify-content: center; background: #1f2833; padding: 10px; gap: 15px; border-bottom: 2px solid #45a29e; }
        .nav-btn { padding: 8px 16px; border-radius: 6px; text-decoration: none; color: #fff; font-weight: bold; font-size: 14px; background: #0b0c10; border: 1px solid #45a29e; }
        .nav-btn.active { background: #66fcf1; color: #0b0c10; border-color: #66fcf1; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 55px); padding: 20px; text-align: center; }
        h1 { margin-bottom: 5px; color: #ff4757; font-size: 32px; text-shadow: 0 0 15px rgba(255, 71, 87, 0.6); }
        p { color: #c5c6c7; margin-bottom: 25px; }
        .grid-levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; max-width: 480px; width: 100%; margin-bottom: 25px; }
        .lvl-btn { background: #1f2833; border: 2px solid #45a29e; color: #66fcf1; padding: 14px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .lvl-btn:hover { background: #ff4757; color: #fff; border-color: #ff6b6b; transform: translateY(-2px); }
        .play-btn { padding: 15px 40px; font-size: 18px; font-weight: bold; background: linear-gradient(45deg, #ff4757, #1e90ff); border: none; border-radius: 30px; color: white; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.6); }
        .play-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="index.html" class="nav-btn active">index.html (Menu)</a>
        <a href="api.html" class="nav-btn">api.html (Mode Api)</a>
        <a href="air.html" class="nav-btn">air.html (Mode Air)</a>
    </div>

    <div class="container">
        <h1>FIRE & WATER (DUAL BUTTON CO-OP)</h1>
        <p>Setiap pintu dilengkapi 2 tombol (sebelum & sesudah). Cairan tertanam rapi di dalam tembok.</p>
        
        <div class="grid-levels">
            <button class="lvl-btn" onclick="startLevel(1)">1</button>
            <button class="lvl-btn" onclick="startLevel(2)">2</button>
            <button class="lvl-btn" onclick="startLevel(3)">3</button>
            <button class="lvl-btn" onclick="startLevel(4)">4</button>
            <button class="lvl-btn" onclick="startLevel(5)">5</button>
            <button class="lvl-btn" onclick="startLevel(6)">6</button>
            <button class="lvl-btn" onclick="startLevel(7)">7</button>
            <button class="lvl-btn" onclick="startLevel(8)">8</button>
            <button class="lvl-btn" onclick="startLevel(9)">9</button>
            <button class="lvl-btn" onclick="startLevel(10)">10</button>
        </div>

        <button class="play-btn" onclick="startLevel(1)">MULAI GAME (2 PLAYER)</button>
    </div>

    <script>
        function startLevel(lvl) {
            window.location.href = `api.html?mode=coop&level=${lvl}`;
        }
    </script>
</body>
</html>
