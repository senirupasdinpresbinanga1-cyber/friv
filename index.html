<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fire & Water - Menu Utama</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; background: #0f0f1b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; overflow: hidden; }
        .nav-bar { display: flex; justify-content: center; background: #1a1a2e; padding: 10px; gap: 15px; border-bottom: 2px solid #333; }
        .nav-btn { padding: 8px 16px; border-radius: 6px; text-decoration: none; color: #fff; font-weight: bold; font-size: 14px; background: #2a2a40; border: 1px solid #444; }
        .nav-btn.active { background: #e74c3c; border-color: #ff6b6b; }
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 55px); padding: 20px; text-align: center; }
        h1 { margin-bottom: 5px; color: #f39c12; font-size: 32px; text-shadow: 0 0 10px rgba(243, 156, 18, 0.5); }
        p { color: #aaa; margin-bottom: 25px; }
        .grid-levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; max-width: 500px; width: 100%; margin-bottom: 30px; }
        .lvl-btn { background: #222538; border: 2px solid #3d426b; color: #fff; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .lvl-btn:hover { background: #e74c3c; border-color: #ff7675; transform: scale(1.05); }
        .play-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background: linear-gradient(45deg, #ff4757, #2ed573); border: none; border-radius: 30px; color: white; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .play-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="index.html" class="nav-btn active">index.html (Menu Utama)</a>
        <a href="api.html" class="nav-btn">api.html (Mode Api)</a>
        <a href="air.html" class="nav-btn">air.html (Mode Air)</a>
    </div>

    <div class="container">
        <h1>FIRE & WATER CO-OP GAME</h1>
        <p>Pilih Level (1 - 10). Kontrol tombol di bagian bawah layar mendukung multi-touch bebas bentrok.</p>
        
        <div class="grid-levels">
            <button class="lvl-btn" onclick="startLevel(1)">1</button>
            <button class="lvl-btn" onclick="startLevel(2)">2</button>
            <button class="lvl-btn" onclick="startLevel(3)">3</button>
            <button class="lvl-btn" onclick="startLevel(4)">4</button>
            <button class="lvl-btn" onclick="startLevel(5)">5</button>
            <button class="lvl-btn" onclick="startLevel(6)">6</button>
            <button class="lvl-btn" onclick="startLevel(7)">7</button>
            <button class="lvl-btn" onclick="startLevel(8)">8</button>
            <button class="lvl-btn" onclick="startLevel(9)">9</button>
            <button class="lvl-btn" onclick="startLevel(10)">10</button>
        </div>

        <button class="play-btn" onclick="startLevel(1)">MULAI GAME (LEVEL 1)</button>
    </div>

    <script>
        function startLevel(lvl) {
            window.location.href = `api.html?mode=coop&level=${lvl}`;
        }
    </script>
</body>
</html>
